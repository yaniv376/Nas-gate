{% extends "base.html" %}
{% block content %}
<h1>{{ s.app }}</h1>
<section class="card">
  <h2>{{ s.setup_title }}</h2>
  {% if error %}<p class="err">{{ s[error] if error in s else error }}</p>{% endif %}
  <form method="post" action="/setup">
    <label>{{ s.password }}<input type="password" name="password" minlength="8" required autofocus></label>
    <label>{{ s.password2 }}<input type="password" name="password2" minlength="8" required></label>
    <button class="primary big" type="submit">{{ s.btn_save }}</button>
  </form>
</section>
{% endblock %}
